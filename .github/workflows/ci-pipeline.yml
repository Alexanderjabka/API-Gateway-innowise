name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:

env:
  JAVA_VERSION: '17'
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and package with Maven
        run: mvn -B clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

      - name: Upload target folder
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: target/

      - name: Run tests
        run: mvn -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 1

  code-analysis:
    name: Code Analysis (SonarCloud)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: target/

      - name: SonarCloud Analysis
        run: |
          SONAR_ARGS="-Dsonar.projectKey=Alexanderjabka_API-Gateway-innowise \
            -Dsonar.organization=alexanderjabka \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_ARGS="$SONAR_ARGS \
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
              -Dsonar.pullrequest.branch=${{ github.head_ref }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }}"
          fi
          mvn -B sonar:sonar $SONAR_ARGS

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image and tags
        run: |
          # Get the first tag from metadata output (tags are newline-separated)
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          # Get image ID from the tagged image
          IMAGE_ID=$(docker images --format "{{.ID}}" $FIRST_TAG | head -n1)
          # Save image by ID to preserve all tags
          docker save $IMAGE_ID -o api-gateway.tar
          # Save tags to file for use in publish job
          echo "${{ steps.meta.outputs.tags }}" > docker-tags.txt

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: api-gateway.tar
          retention-days: 1

      - name: Upload Docker tags
        uses: actions/upload-artifact@v4
        with:
          name: docker-tags
          path: docker-tags.txt
          retention-days: 1

  publish-docker-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Download Docker tags
        uses: actions/download-artifact@v4
        with:
          name: docker-tags

      - name: Load Docker image
        run: docker load -i api-gateway.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          # Get the first tag from saved tags file
          FIRST_TAG=$(head -n1 docker-tags.txt)
          # Push all tags - Docker will push all tags associated with the image
          docker image push --all-tags $FIRST_TAG || docker image push $FIRST_TAG

      - name: Docker Hub image URL
        run: echo "Image published to https://hub.docker.com/r/${{ env.DOCKER_IMAGE_NAME }}"
